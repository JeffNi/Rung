  description: "At EY Consulting, we are building a better working world by transforming businesses through the power of people, technology, and innovation. The advent of emerging tech is recasting all industries and requires our clients to embrace turning new technology capabilities into new competitive advantages. We work collaboratively with some of the top executives in the largest companies in the world, helping them create and realize the best solutions for the future of their companies. Each project will be different, so you’ll need to be able to excel in ambiguous situations and confidently navigate ever-changing circumstances. We’ll look to you to take ownership of projects, be a self-starter, have the ability to translate complex information into simple terms, and deliver long-term solutions with confidence. On this team, you’ll have the unique opportunity to imagine the future as well as create it, where you can craft ideas and implement them for our clients."
  requirements:
    - "Pursuing an undergraduate or graduate degree in business, STEM, or another related major"
    - "Demonstrated project management, teaming, organizational, analytical, and problem-solving skills and the willingness and ability to learn and work independently with minimal supervision"
    - "Effective organization and time management skills with the ability to work under pressure and adhere to project deadlines"
    - "Strong interpersonal, written, and verbal communication skills"
    - "Committed to integrity within a professional environment"
    - "Quebec based roles involve interaction with clients operating nationally and globally where fluency in French and English is required. Bilingualism in both French and English is therefore a requirement of this role."
  responsibilities:
    - "Maintain a strong client focus, be responsive to client requests, and to develop/maintain productive working relationships with client personnel."
    - "Be informed of current business/economic developments relevant to the client's business and collaborate with team members to set goals and responsibilities for the project."
